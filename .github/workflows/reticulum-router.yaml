name: Build reticulum-router
on:
  push:
    tags:
      - v*
jobs:
  build:
    env:
      REPOSITORY: "ghcr.io/reticulalabs"
      NAME: "reticulum-router"
    name: Build reticulum-router container
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Detect version
      id: detect-version
      run: echo "RELEASE_VERSION=$(git describe --tags --dirty --match=v* --abbrev=1)" >> "$GITHUB_OUTPUT"
    - name: List version
      run: echo "Building ${{ steps.detect-version.outputs.RELEASE_VERSION }}..."
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: amd64,arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        platforms: linux/amd64,linux/arm64
    - name: Login to Github Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push multi-architecture image
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: |
          ${{env.REPOSITORY}}/${{env.NAME}}:${{ steps.detect-version.outputs.RELEASE_VERSION }}-amd64
          ${{env.REPOSITORY}}/${{env.NAME}}:${{ steps.detect-version.outputs.RELEASE_VERSION }}-arm64
        platforms: linux/amd64,linux/arm64
    - uses: int128/docker-manifest-create-action@v2
      with:
        tags: ${{env.REPOSITORY}}/${{env.NAME}}:${{ steps.detect-version.outputs.RELEASE_VERSION }}
        sources: |
          ${{env.REPOSITORY}}/${{env.NAME}}:${{ steps.detect-version.outputs.RELEASE_VERSION }}-amd64
          ${{env.REPOSITORY}}/${{env.NAME}}:${{ steps.detect-version.outputs.RELEASE_VERSION }}-arm64
