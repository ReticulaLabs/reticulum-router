[package]
name = "reticulum-router"
version = "1.9.13"
edition = "2024"

[dependencies]
dirs = "6.0"
base64 = "0.22.1"
ed25519-dalek = "3.0"
rand = "0.10"
rmpv = "1.3.0"
serde = "1.0.228"
serde_json = "1.0"
sha2 = "0.10.8"
hmac = "0.12.1"
toml = "1.0"
nix = { version = "0.26", features = ["term", "signal", "ioctl", "fs", "process", "feature"] }
libc = "0.2"
bzip2 = "0.5"
hex = "0.4"

# Async IO
tokio = { version = "1.44.2", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.15"

# Logging
log = "0.4"
env_logger = "0.10"

# Core Reticulum Implementation
#reticulum-sdk = { path = "../reticulum-sdk" }
#reticulum-sdk = { git = "https://github.com/reticulaLabs/reticulum-sdk" }
reticulum-sdk = "2.2"
